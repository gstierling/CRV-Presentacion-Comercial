<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Generador de Propuestas · CicloRecreoVía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@4.0.1/dist/pptxgen.bundle.js"></script>
<style>
:root{--bg:#f3f5f8;--panel:#ffffff;--panel2:#eef1f5;--line:#d6dce4;--txt:#111827;--mut:#5b6573;--or:#e87115;--te:#179741;--bl:#0b69b2;--red:#d93025}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Nunito,system-ui,sans-serif;font-size:17px}
body{min-height:100dvh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:17px}
/* Header */
header{position:sticky;top:0;z-index:20;background:#fff;padding:12px 16px 10px;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(17,24,39,.05)}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand b{font-weight:900;font-size:15px;color:var(--mut);letter-spacing:.5px}
.brand b span{color:var(--or)}
.hbtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 11px;font-size:14px;font-weight:700}
.stepname{font-size:24px;font-weight:900;margin:8px 0 8px}
.prog{display:flex;gap:5px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line);cursor:pointer}
.chip,.row,.act,.el,.kpi,.sel,.field,.imgz,.opt{box-shadow:0 1px 3px rgba(17,24,39,.06)}
.prog i.on{background:var(--or)}.prog i.done{background:var(--te)}
/* Main */
main{flex:1;padding:16px 16px 120px;max-width:900px;width:100%;margin:0 auto}
.hint{color:var(--mut);font-size:15px;margin:0 0 14px;line-height:1.4}
.lbl{font-weight:800;font-size:15px;color:var(--mut);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.6px}
.field{width:100%;background:var(--panel);border:2px solid var(--line);color:var(--txt);border-radius:14px;padding:14px 16px;font-size:18px;outline:none}
.field:focus{border-color:var(--or)}
textarea.field{min-height:120px;resize:vertical;line-height:1.4}
.sel{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:2px solid var(--line);color:var(--txt);border-radius:14px;padding:14px 16px;font-size:18px;font-weight:700;text-align:left}
.sel small{display:block;color:var(--mut);font-weight:600;font-size:14px}
.sel:after{content:"▾";color:var(--or);font-size:20px;margin-left:10px}
/* Chips / cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--txt);min-height:92px;display:flex;flex-direction:column;gap:6px;position:relative}
.chip b{font-size:17px;font-weight:800;line-height:1.2}
.chip small{color:var(--mut);font-size:13px;line-height:1.3}
.chip.on{border-color:var(--or);background:#fdf0e6}
.chip.on:after{content:"✓";position:absolute;top:8px;right:10px;background:var(--or);color:#fff;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row.on{border-color:var(--or)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:16px}
.row .tx small{color:var(--mut);font-size:13px}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:900;color:#fff;background:#fff}
.row.on .chk{background:var(--or);border-color:var(--or)}
.chk:after{content:"✓";opacity:0}.row.on .chk:after{opacity:1}
/* Activation cards */
.act{background:var(--panel);border:2px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px;display:flex;cursor:pointer}
.act img{width:120px;object-fit:cover;flex:none}
.act .in{padding:12px 14px;flex:1;min-width:0}
.act .in b{font-size:18px;display:block}
.act .in small{color:var(--mut);display:block;margin-top:2px}
.act .money{color:var(--or);font-weight:900;font-size:18px;margin-top:6px}
.addbtn{width:100%;padding:18px;border-radius:16px;border:2px dashed var(--or);background:transparent;color:var(--or);font-size:18px;font-weight:900}
.addbtn:disabled{opacity:.35}
/* Steppers */
.el{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.el.on{border-color:var(--te)}
.el .tx{flex:1;min-width:0}.el .tx b{display:block;font-size:16px}.el .tx small{color:var(--mut);font-size:13px}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:44px;height:44px;border-radius:12px;border:none;background:var(--panel2);color:var(--txt);font-size:24px;font-weight:900}
.stp .q{min-width:52px;height:44px;border-radius:12px;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:900}
.el.on .q{border-color:var(--te);color:var(--te)}
.total{display:flex;justify-content:space-between;align-items:center;background:#fdf0e6;border:2px solid var(--or);border-radius:14px;padding:14px 16px;font-weight:900;font-size:18px;margin-top:6px}
.total span{color:var(--or);font-size:22px}
.kpi{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.kpi .tx{flex:1}.kpi .tx b{display:block}.kpi .tx small{color:var(--mut);font-size:13px}
.kpi .num{min-width:110px;height:48px;border-radius:12px;background:var(--bg);border:2px solid var(--te);color:var(--te);font-size:20px;font-weight:900;padding:0 10px}
.kpi .num.man{border-color:var(--or);color:var(--or)}
.mini{background:none;border:none;color:var(--mut);font-size:13px;text-decoration:underline;padding:4px}
/* Image zone */
.imgz{border:2px dashed var(--line);border-radius:16px;padding:12px;background:var(--panel);outline:none}
.imgz.act2{border-color:var(--te)}
.imgz .prev{width:100%;aspect-ratio:16/9;border-radius:12px;background:#e9edf2 center/contain no-repeat;margin-bottom:10px;display:grid;place-items:center;color:var(--mut);font-size:14px;text-align:center}
.imgz .btns{display:flex;gap:8px;flex-wrap:wrap}
.imgz .btns button{flex:1;min-width:110px;padding:12px;border-radius:12px;border:none;background:var(--panel2);color:var(--txt);font-weight:800;font-size:15px}
.imgz .btns button.pri{background:var(--te);color:#fff}
.seg{display:flex;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;padding:12px 6px;border:none;border-radius:10px;background:transparent;color:var(--mut);font-weight:800;font-size:15px}
.seg button.on{background:var(--or);color:#fff}
/* Bottom nav */
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);box-shadow:0 -2px 12px rgba(17,24,39,.08);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
nav.bot button{flex:1;padding:16px 6px;border-radius:14px;border:none;font-size:16px;font-weight:900;white-space:nowrap}
.b-sec{background:var(--panel2);color:var(--txt)}
.b-pri{background:var(--or);color:#fff}
.b-te{background:var(--te);color:#fff}
.b-big{width:100%;padding:20px;border-radius:16px;border:none;font-size:20px;font-weight:900;margin-top:10px}
/* Sheets */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}
.sheet h3{margin:4px 0 12px;font-size:20px;font-weight:900}
.opt{width:100%;text-align:left;background:var(--panel2);border:2px solid transparent;color:var(--txt);border-radius:14px;padding:14px 16px;margin-bottom:8px;font-size:17px;font-weight:800}
.opt small{display:block;color:var(--mut);font-weight:600;font-size:14px;margin-top:3px;line-height:1.35}
.opt.on{border-color:var(--or)}
/* Keypad */
.kp-disp{background:var(--bg);border:2px solid var(--te);border-radius:14px;padding:14px 18px;font-size:38px;font-weight:900;text-align:right;color:var(--te);min-height:70px;margin-bottom:12px;word-break:break-all}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp button{height:64px;border-radius:14px;border:none;background:var(--panel2);color:var(--txt);font-size:28px;font-weight:900}
.kp .ok{grid-column:span 3;background:var(--te);color:#fff;font-size:22px}
.kp .del{color:var(--or)}
/* Full editor */
.full{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;padding-bottom:110px}
.full header{display:flex;align-items:center;gap:10px}
.full header .stepname{flex:1;margin:0;font-size:21px}
/* Preview */
.pv{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
.pv-top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:#fff;font-weight:800}
.pv .hbtn{background:#1f2630;border-color:#2d3640;color:#fff}
.pv-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 10px;position:relative;touch-action:pan-y}
.pv-stage .sw{width:min(100%, calc((100dvh - 190px) * 16 / 9));flex:none}
.pv-nav{display:flex;gap:10px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));align-items:center}
.pv-nav button{flex:1;padding:8px 16px;border-radius:14px;border:none;background:var(--panel2);color:#fff;font-size:34px;line-height:1;font-weight:900}
.pv-nav button:disabled{opacity:.25}
.pv-nav .cnt{flex:1.4;text-align:center;color:#c9d1d9;font-weight:800;font-size:14px;line-height:1.3}
.sw{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#fff;border-radius:6px}
.sw>.s{position:absolute;left:0;top:0;width:1333.33px;height:750px;transform-origin:0 0;font-family:Arial,Helvetica,sans-serif}
.pv-cap{color:#8b949e;text-align:center;font-size:14px;margin-top:8px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumbs .sw{border-radius:8px;cursor:pointer;border:2px solid var(--line)}
.ccard{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px}
.ccard>.row{border:none;box-shadow:none;padding:4px 4px 8px;margin:0}
.ccard .lbl{margin-top:6px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--te);color:#fff;font-weight:900;padding:12px 18px;border-radius:12px;z-index:90}
.warn{background:#fff4e8;border:1px solid var(--or);color:#8a4300;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
@media(min-width:700px){.act img{width:180px}}
/* Columna de miniaturas (pantallas anchas) */
#aside{display:none}
@media(min-width:900px){
  body{padding-right:20%}
  #aside{display:flex;flex-direction:column;position:fixed;top:0;right:0;bottom:0;width:20%;background:#e8ecf1;border-left:1px solid var(--line);z-index:45}
  #aside .ah{padding:14px 14px 8px;font-weight:900;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;display:flex;justify-content:space-between;align-items:center}
  #aside .al{flex:1;overflow:auto;padding:4px 14px 20px}
  #aside .th{margin-bottom:12px;cursor:pointer}
  #aside .th .sw{border-radius:6px;border:3px solid transparent;box-shadow:0 1px 4px rgba(17,24,39,.15)}
  #aside .th.hi .sw{border-color:var(--or)}
  #aside .th .cap{font-size:12px;font-weight:800;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #aside .th.hi .cap{color:var(--or)}
  nav.bot{right:20%}
  .full{right:20%}
  main{max-width:none;padding-left:28px;padding-right:28px}
}

/* Compacto en pantallas anchas */
@media(min-width:900px){
  body{font-size:15px}
  main{padding-top:12px}
  .stepname{font-size:21px;margin:6px 0}
  .lbl{margin:14px 0 6px;font-size:13px}
  .hint{font-size:14px;margin-bottom:10px;max-width:760px}
  .field,.sel,.seg,.total{max-width:480px}
  .field{padding:10px 14px;font-size:16px}
  .sel{padding:10px 14px;font-size:16px}
  textarea.field{max-width:760px;min-height:90px}
  .imgz{max-width:340px;padding:10px}
  .imgz .btns button{padding:9px;font-size:14px;min-width:90px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
  .chip{min-height:70px;padding:10px 12px;border-radius:12px}
  .chip b{font-size:15px}.chip small{font-size:12px}
  .rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-bottom:8px}
  .rows>*{margin:0!important}
  .rows.acts{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
  .rows.opts{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .row{padding:8px 12px;border-radius:12px;gap:10px}
  .row .tx b{font-size:14px}.row .tx small{font-size:12px}
  .chk{width:24px;height:24px;border-radius:7px;font-size:13px}
  .el{padding:6px 10px;border-radius:12px}
  .el .tx b{font-size:14px}.el .tx small{font-size:12px}
  .stp button{width:36px;height:36px;font-size:20px;border-radius:10px}
  .stp .q{min-width:44px;height:36px;font-size:17px;border-radius:10px}
  .kpi{padding:6px 10px;border-radius:12px}
  .kpi .num{height:38px;min-width:90px;font-size:17px}
  .opt{padding:10px 12px;font-size:15px;border-radius:12px}
  .opt small{font-size:12px}
  .act{border-radius:14px}.act img{width:110px}
  .act .in{padding:10px 12px}.act .in b{font-size:16px}.act .in small{font-size:12px}.act .money{font-size:16px}
  .addbtn{max-width:480px;padding:12px;font-size:16px}
  .total{padding:10px 14px;font-size:16px}.total span{font-size:19px}
  .b-big{max-width:480px;padding:14px;font-size:17px}
  nav.bot{justify-content:flex-end}
  nav.bot button{flex:0 0 auto;min-width:150px;padding:12px 18px;font-size:15px}
  .thumbs{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start}
  .cgrid .ccard{margin:0}
  .cols2{display:grid;grid-template-columns:minmax(0,480px) minmax(0,340px);gap:32px;align-items:start}
}
</style>
</head>
<body>
<header>
  <div class="brand"><div style="display:flex;align-items:center;gap:10px"><img id="hlogo" style="height:40px"><b>PROPUESTAS</b></div>
    <div style="display:flex;gap:6px"><button class="hbtn" onclick="A.menu()">☰ Menú</button></div></div>
  <div class="stepname" id="stepname"></div>
  <div class="prog" id="prog"></div>
</header>
<main id="main"></main>
<nav class="bot" id="nav"></nav>
<aside id="aside"><div class="ah"><span>Láminas</span><span id="acount"></span></div><div class="al" id="alist"></div></aside>
<div id="layer"></div>

<script>
/* =====================================================================
   CATÁLOGO (DATOS DE EJEMPLO) — en la versión final se lee desde Google Sheets
   ===================================================================== */
const CAT = {
  crv:{
    descripcion:"CicloRecreoVía abre las calles de Santiago cada domingo para que miles de personas caminen, pedaleen, patinen y compartan en familia. Es el espacio público recreativo más masivo de la ciudad: un punto de encuentro con alto tiempo de permanencia y un público activo, diverso y receptivo a las marcas que aportan a su experiencia.",
    stats:[{n:"+30.000",l:"personas cada domingo",ic:"users"},{n:"40 km",l:"de calles abiertas",ic:"route"},{n:"2 ciudades",l:"Santiago · Viña del Mar",ic:"mappin"},{n:"+15",l:"años de trayectoria",ic:"award"}]
  },
  objetivos:[
    {id:"branding",t:"Branding",d:"Presencia visible de la marca en los puntos de mayor flujo del circuito.",kpi:"visualizaciones",ic:"flag"},
    {id:"bbdd",t:"Generar BBDD",d:"Captura de datos de contacto con consentimiento, en terreno.",kpi:"bbdd",ic:"database"},
    {id:"sampling",t:"Entregar sampling",d:"Prueba de producto en un momento de alta receptividad.",kpi:"sampling",ic:"cup"},
    {id:"merch",t:"Entregar merchandising",d:"Artículos de marca que acompañan a las personas en su recorrido.",kpi:"merch",ic:"shirt"},
    {id:"experiencia",t:"Generar una experiencia",d:"Una dinámica memorable que conecta la marca con el disfrute.",kpi:"participantes",ic:"sparkles"},
    {id:"seguidores",t:"Aumentar seguidores",d:"Crecimiento de comunidad en RRSS a partir de la interacción presencial.",kpi:"seguidores",ic:"userplus"},
    {id:"awareness",t:"Awareness",d:"Mayor conocimiento de la marca en un público masivo y familiar.",kpi:"visualizaciones",ic:"megaphone"},
    {id:"flujo",t:"Flujo a locales",d:"Más visitas a los locales cercanos mediante cupones o incentivos.",kpi:"flujo",ic:"store"},
    {id:"lanzamiento",t:"Lanzamiento de producto",d:"Dar a conocer una novedad con alto impacto y contacto directo.",kpi:"participantes",ic:"rocket"},
    {id:"comunidad",t:"Vínculo con la comunidad",d:"Asociar la marca a la vida sana, el deporte y la ciudad.",kpi:"participantes",ic:"heart"}
  ],
  kpis:[
    {id:"visualizaciones",t:"Visualizaciones",ic:"eye"},
    {id:"sampling",t:"Samplings entregados",ic:"cup"},
    {id:"bbdd",t:"Registros en BBDD",ic:"database"},
    {id:"seguidores",t:"Nuevos seguidores",ic:"userplus"},
    {id:"merch",t:"Merchandising entregado",ic:"shirt"},
    {id:"participantes",t:"Personas participando",ic:"users"},
    {id:"flujo",t:"Cupones / visitas a locales",ic:"store"}
  ],
  // p = precio por domingo (CLP neto). k = aporte a cada KPI por unidad y jornada
  elementos:[
    {id:"promotor",t:"Promotor/a",p:60000,k:{sampling:350,bbdd:60,seguidores:50,merch:150,participantes:200,flujo:40}},
    {id:"animador",t:"Animador/a",p:90000,k:{participantes:300,seguidores:40}},
    {id:"supervisor",t:"Supervisor/a",p:80000,k:{}},
    {id:"bandera",t:"Bandera",p:45000,k:{visualizaciones:8000}},
    {id:"pendon",t:"Pendón",p:35000,k:{visualizaciones:5000}},
    {id:"quitasol",t:"Quitasol",p:30000,k:{visualizaciones:3000}},
    {id:"carpa",t:"Carpa 3x3",p:120000,k:{visualizaciones:10000}},
    {id:"lienzo",t:"Lienzo en ruta",p:90000,k:{visualizaciones:15000}},
    {id:"mesa",t:"Mesa con mantel",p:25000,k:{}},
    {id:"juego",t:"Juego / desafío interactivo",p:150000,k:{participantes:400,bbdd:120,seguidores:80}},
    {id:"tablet",t:"Tablet de registro",p:40000,k:{bbdd:80}},
    {id:"altavoz",t:"Mención por altavoz",p:20000,k:{visualizaciones:5000}}
  ],
  tipos:[
    {id:"stand",t:"Stand de sampling",d:"Punto fijo de prueba de producto",el:{carpa:1,promotor:2,mesa:1,bandera:2},din:["d1","d2"],color:"#f97316"},
    {id:"ruta",t:"Branding en ruta",d:"Presencia de marca a lo largo del circuito",el:{bandera:6,pendon:4,lienzo:1},din:["d3"],color:"#2563eb"},
    {id:"registro",t:"Punto de registro",d:"Captura de BBDD con incentivo",el:{carpa:1,promotor:2,tablet:2,quitasol:1},din:["d4","d2"],color:"#7c3aed"},
    {id:"juego",t:"Juego / desafío",d:"Dinámica lúdica con premio",el:{carpa:1,juego:1,animador:1,promotor:1,bandera:2},din:["d5","d6"],color:"#0891b2"},
    {id:"experiencia",t:"Experiencia de marca",d:"Espacio inmersivo de la marca",el:{carpa:2,animador:1,promotor:2,bandera:4,pendon:2},din:["d7","d6"],color:"#db2777"}
  ],
  dinamicas:[
    {id:"d1",t:"Prueba y lleva",tx:"Las personas se acercan al stand, prueban el producto y reciben información sobre sus beneficios. El equipo de promotores invita activamente a quienes pasan por el circuito."},

/* Foto estándar provisoria (se reemplaza por fotos reales en el catálogo) */
const STD={};
function stdPhoto(key,label,color){
  if(STD[key]) return STD[key];
  const W=1600,H=1000,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,color);gr.addColorStop(1,"#0d1117");g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.globalAlpha=.10;g.fillStyle="#fff";for(let i=-H;i<W;i+=90){g.beginPath();g.moveTo(i,0);g.lineTo(i+45,0);g.lineTo(i+45+H,H);g.lineTo(i+H,H);g.fill()}
  g.globalAlpha=.22;g.strokeStyle="#fff";g.lineWidth=26;
  [[560,640],[1040,640]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,170,0,Math.PI*2);g.stroke()});
  g.beginPath();g.moveTo(560,640);g.lineTo(760,420);g.lineTo(1040,640);g.moveTo(760,420);g.lineTo(700,640);g.lineTo(560,640);g.moveTo(760,420);g.lineTo(960,420);g.lineTo(1040,640);g.stroke();
  g.globalAlpha=1;g.textAlign="center";g.fillStyle="rgba(0,0,0,.35)";g.fillRect(W/2-430,120,860,150);
  g.fillStyle="#fff";g.font="900 54px Nunito, Arial";g.fillText(label,W/2,195);
  g.font="700 28px Nunito, Arial";g.fillStyle="rgba(255,255,255,.75)";g.fillText("FOTO DE EJEMPLO",W/2,245);
  return STD[key]={data:c.toDataURL("image/jpeg",.85),w:W,h:H};
}
function fotoPortada(){return S.portada&&S.portada.data?S.portada:stdPhoto("portada","CicloRecreoVía","#e87115")}
function fotoCierre(){return stdPhoto("cierre","¡Nos vemos el domingo!","#179741")}
function fotoAct(a){if(a.foto&&a.foto.data) return a.foto;const t=byId(CAT.tipos,a.tipo)||CAT.tipos[0];return stdPhoto("tipo_"+t.id,t.t,t.color)}

/* Imagen → comprime y devuelve {data,w,h} */
function loadImg(src){return new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=src})}
async function procesarImagen(blob,isLogo){
  const url=URL.createObjectURL(blob);const im=await loadImg(url);URL.revokeObjectURL(url);
  const max=isLogo?900:1600;let w=im.naturalWidth,h=im.naturalHeight;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
  const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");
  if(!isLogo){g.fillStyle="#fff";g.fillRect(0,0,w,h)}
  g.drawImage(im,0,0,w,h);
  return {data:isLogo?c.toDataURL("image/png"):c.toDataURL("image/jpeg",.85),w,h};
}
/* Recorte "cover" para el PowerPoint */
const CROP={};
async function cropCover(img,bw,bh){
  const key=img.data.length+":"+img.data.slice(-40)+":"+(bw/bh).toFixed(3);
  if(CROP[key]) return CROP[key];
  const im=await loadImg(img.data);const ir=im.naturalWidth/im.naturalHeight,br=bw/bh;
  let sw=im.naturalWidth,sh=im.naturalHeight,sx=0,sy=0;
  if(ir>br){sw=sh*br;sx=(im.naturalWidth-sw)/2}else{sh=sw/br;sy=(im.naturalHeight-sh)/2}
  const ow=Math.min(1600,Math.round(sw)),oh=Math.round(ow/br);
  const c=document.createElement("canvas");c.width=ow;c.height=oh;c.getContext("2d").drawImage(im,sx,sy,sw,sh,0,0,ow,oh);
  return CROP[key]=c.toDataURL("image/jpeg",.88);
}

/* data URL → object URL (más liviano para miniaturas y vista previa) */
const OBJ=new Map();
function objUrl(d){if(!d||!d.startsWith("data:"))return d;let u=OBJ.get(d);if(u)return u;
  try{const [h,b]=d.split(",");const mime=h.slice(5).split(";")[0];const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
    u=URL.createObjectURL(new Blob([a],{type:mime}))}catch(e){u=d}OBJ.set(d,u);return u}
/* Columna de miniaturas */
let asideT,asideBusy=false,asideAgain=false;
function asideLater(){clearTimeout(asideT);asideT=setTimeout(updateAside,350)}
function pasoActual(list){
  if(editAct)return list.map((p,i)=>p.k==="act"&&p.a.uid===editAct?i:-1).filter(i=>i>=0);
  const want=[["portada"],["crv","circ","perf","rrss"],["objetivos"],["act"],["tarifas"],["comunicacion"],["condiciones","enlaces"],["libre"],[]][cur]||[];
  return list.map((p,i)=>want.includes(p.k)?i:-1).filter(i=>i>=0);
}
async function updateAside(){
  const el=$("#alist");if(!el||getComputedStyle($("#aside")).display==="none")return;
  if(asideBusy){asideAgain=true;return}asideBusy=true;
  try{const list=plan();const hs=await renderHtmlSlides(list);const hi=pasoActual(list);
    el.innerHTML=hs.map((h,i)=>`<div class="th ${hi.includes(i)?"hi":""}" onclick="A.preview(${i})"><div class="sw">${h}</div><div class="cap">${i+1}. ${esc(list[i].name)}</div></div>`).join("");
    $("#acount").textContent=list.length;scaleSlides(el);
    if(hi.length){const t=el.children[hi[0]];if(t&&(t.offsetTop<el.scrollTop||t.offsetTop>el.scrollTop+el.clientHeight-80))el.scrollTo({top:t.offsetTop-12,behavior:"smooth"})}
  }finally{asideBusy=false;if(asideAgain){asideAgain=false;asideLater()}}
}

/* Cálculos */
function subDomingo(a){return Object.entries(a.elementos||{}).reduce((s,[id,q])=>{const e=byId(CAT.elementos,id);return s+(e?e.p*q:0)},0)}
function precioPeriodo(a,p){return Math.round(subDomingo(a)*p.dom*(1-p.desc/100))}
function kpisAct(a){
  const ids=[...new Set((a.objetivos||[]).map(o=>(byId(CAT.objetivos,o)||{}).kpi).filter(Boolean))];
  return ids.map(id=>{
    const auto=Object.entries(a.elementos||{}).reduce((s,[eid,q])=>{const e=byId(CAT.elementos,eid);return s+((e&&e.k[id])||0)*q},0);
    const man=a.kpiMan&&a.kpiMan[id]!=null?a.kpiMan[id]:null;
    return {id,t:byId(CAT.kpis,id).t,auto,man,v:man!=null?man:auto};
  }).filter(k=>k.v>0||k.man!=null);
}
function kpisTotales(){const m={};S.activaciones.forEach(a=>kpisAct(a).forEach(k=>{m[k.id]=(m[k.id]||0)+k.v}));

async function generarPPTX(){
  if(!window.PptxGenJS){alert("No se pudo cargar el generador de PowerPoint. Revisa tu conexión a internet.");return}
  const faltas=validar();if(faltas.length&&!confirm("Falta:\n• "+faltas.join("\n• ")+"\n\n¿Generar de todas formas?"))return;
  toast("Generando PowerPoint…");
  const pptx=new PptxGenJS();pptx.layout="LAYOUT_WIDE";pptx.author=vendedor().n;pptx.company="CicloRecreoVía";pptx.title="Propuesta CicloRecreoVía - "+(S.prospecto||"");
  const R=PptxR(pptx);const list=plan();
  for(let i=0;i<list.length;i++) await dibujar(R,list[i],i+1,list.length);
  const nombre=("Propuesta CicloRecreoVía - "+(S.prospecto||"Prospecto")).replace(/[\\/:*?"<>|]/g,"");
  await pptx.writeFile({fileName:nombre+".pptx"});
}
function validar(){const f=[];if(!S.prospecto.trim())f.push("Nombre del prospecto");if(!S.objetivos.length)f.push("Al menos un objetivo");if(!S.activaciones.length)f.push("Al menos una activación");
  S.activaciones.forEach((a,i)=>{if(!subDomingo(a))f.push("Elementos de la activación "+(i+1));if(a.din==="otra"&&!a.dinTexto)f.push("Texto de la dinámica de la activación "+(i+1))});
  if(!S.periodos.length)f.push("Al menos un período de tarifa");return f}

const layer=$("#layer");
function closeLayer(){layer.innerHTML="";activeImg=null}
function picker(title,opts,val,onPick){
  layer.innerHTML=`<div class="ov" onclick="if(event.target===this)closeLayer()"><div class="sheet"><h3>${esc(title)}</h3>${opts.map((o,i)=>`<button class="opt ${o.v===val?"on":""}" data-i="${i}">${esc(o.t)}${o.sub?`<small>${esc(o.sub)}</small>`:""}</button>`).join("")}<button class="b-big b-sec" onclick="closeLayer()">Cancelar</button></div></div>`;

function keypad(title,val,onOk,dec){
  let v=val!=null&&val!==""?String(val).replace(".",","):"";
  const draw=()=>{$("#kpd").textContent=v===""?"0":(()=>{const [a,b]=v.split(",");return fmt(+a||0)+(b!=null?","+b:"")})()};
  layer.innerHTML=`<div class="ov" onclick="if(event.target===this)closeLayer()"><div class="sheet"><h3>${esc(title)}</h3><div class="kp-disp" id="kpd"></div><div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button data-k="," ${dec?"":"disabled style=opacity:.25"}>,</button><button data-k="0">0</button><button class="del" data-k="del">⌫</button><button class="ok" data-k="ok">Listo</button></div></div></div>`;
  layer.querySelectorAll(".kp button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;
    if(k==="ok"){closeLayer();onOk(v===""?0:parseFloat(v.replace(",",".")));return}
    if(k==="del")v=v.slice(0,-1);else if(k===","){if(!v.includes(","))v=(v||"0")+","}else if(v.length<12)v=(v==="0"?"":v)+k;draw()});
  draw();
}

function render(){
  asideLater();
  if(editAct){const a=S.activaciones.find(x=>x.uid===editAct);if(a){const sc=($("#full")||{}).scrollTop||0;
    let ed=$("#editor");if(!ed){ed=document.createElement("div");ed.id="editor";document.body.appendChild(ed)}ed.innerHTML=editorAct(a);$("#full").scrollTop=sc;return}editAct=null}
  const ed=$("#editor");if(ed)ed.remove();
  $("#stepname").textContent=STEPS[cur].t;
  $("#prog").innerHTML=STEPS.map((s,i)=>`<i class="${i===cur?"on":i<cur?"done":""}" onclick="A.ir(${i})"></i>`).join("");
  $("#main").innerHTML=STEPS[cur].r();
  $("#nav").innerHTML=`<button class="b-sec" ${cur===0?"disabled style=opacity:.35":""} onclick="A.ir(${cur-1})">← Atrás</button><button class="b-sec" onclick="A.preview(-1)">👁 Ver</button>`+
    (cur<STEPS.length-1?`<button class="b-pri" onclick="A.ir(${cur+1})">Siguiente →</button>`:`<button class="b-te" onclick="A.generar()">⬇ PPTX</button>`);
}
const A={
  ir(i){if(i<0||i>=STEPS.length)return;cur=i;render();window.scrollTo(0,0)},
  toggle(k,id){const a=S[k];const i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);
    if(k==="objetivos"&&i<0) S.activaciones.forEach(x=>{if(!x.objetivos.includes(id))x.objetivos.push(id)});
    if(k==="objetivos"&&i>=0) S.activaciones.forEach(x=>x.objetivos=x.objetivos.filter(o=>o!==id));
    save();const y=window.scrollY;render();window.scrollTo(0,y)},
  pickVendedor(){picker("Vendedor/a",CAT.vendedores.map(v=>({v:v.id,t:v.n,sub:v.c+" · "+v.m})),S.vendedor,v=>{S.vendedor=v;save();render()})},
  portadaPropia(){S._portadaPropia=true;save();render()},
  async pegar(key){
    try{const items=await navigator.clipboard.read();for(const it of items){const ty=it.types.find(t=>t.startsWith("image/"));if(ty){A.setImg(key,await procesarImagen(await it.getType(ty),IMG[key]&&IMG[key].isLogo));return}}
      toast("No hay imagen copiada")}catch(e){activeImg=key;const z=document.getElementById("iz_"+key);if(z)z.focus();toast("Presiona Ctrl+V (o mantén presionado → Pegar)")}
  },
  archivo(key){const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=async()=>{if(i.files[0])A.setImg(key,await procesarImagen(i.files[0],IMG[key]&&IMG[key].isLogo))};i.click()},
  setImg(key,img){
    if(key==="logo")S.logo=img;
    else if(key==="portada"){S.portada=img;if(!img)S._portadaPropia=false}
    else if(key.startsWith("act_")){const a=S.activaciones.find(x=>x.uid===key.slice(4));if(a){a.foto=img;if(!img)a._propia=false}}
    else if(key.startsWith("libre_")){const l=S.libres.find(x=>x.uid===key.slice(6));if(l)l.foto=img}
    else {S.imgs=S.imgs||{};S.imgs[key]=img;if(!img)delete S["_p_"+key]}
    save();const y=window.scrollY;render();window.scrollTo(0,y);
  },
  nuevaAct(){if(S.activaciones.length>=4)return;const t=CAT.tipos[0];
    const a={uid:uid(),tipo:t.id,nombre:t.t,objetivos:[...S.objetivos],din:t.din[0],dinTexto:"",elementos:{...t.el},kpiMan:{},foto:null};
    S.activaciones.push(a);save();A.editar(a.uid)},
  editar(u){editAct=u;render();const f=$("#full");if(f)f.scrollTop=0},
  cerrarEditor(){editAct=null;render()},
  borrarAct(u){if(!confirm("¿Quitar esta activación?"))return;S.activaciones=S.activaciones.filter(a=>a.uid!==u);editAct=null;save();render()},
  pickTipo(u){const a=S.activaciones.find(x=>x.uid===u);picker("Tipo de activación",CAT.tipos.map(t=>({v:t.id,t:t.t,sub:t.d})),a.tipo,v=>{const t=byId(CAT.tipos,v);
    const old=byId(CAT.tipos,a.tipo);if(a.nombre===old.t||!a.nombre)a.nombre=t.t;a.tipo=v;a.elementos={...t.el};a.din=t.din[0];a.kpiMan={};save();render()})},
  setA(u,k,v,re){const a=S.activaciones.find(x=>x.uid===u);a[k]=v;save();if(re)render()},
  toggleObjAct(u,id){const a=S.activaciones.find(x=>x.uid===u);const i=a.objetivos.indexOf(id);i<0?a.objetivos.push(id):a.objetivos.splice(i,1);save();render()},
  qty(u,id,d){const a=S.activaciones.find(x=>x.uid===u);const q=Math.max(0,(a.elementos[id]||0)+d);if(q)a.elementos[id]=q;else delete a.elementos[id];save();render()},
  qtyKp(u,id){const a=S.activaciones.find(x=>x.uid===u);keypad("Cantidad · "+byId(CAT.elementos,id).t,a.elementos[id]||"",v=>{v=Math.round(v);if(v>0)a.elementos[id]=v;else delete a.elementos[id];save();render()})},
  kpiKp(u,id){const a=S.activaciones.find(x=>x.uid===u);a.kpiMan=a.kpiMan||{};keypad(byId(CAT.kpis,id).t+" por domingo",a.kpiMan[id]!=null?a.kpiMan[id]:"",v=>{a.kpiMan[id]=Math.round(v);save();render()})},
  kpiAuto(u,id){const a=S.activaciones.find(x=>x.uid===u);delete a.kpiMan[id];save();render()},
  nuevaLibre(){S.libres.push({uid:uid(),titulo:"",texto:"",pos:"act",foto:null});save();render()},
  borrarLibre(u){S.libres=S.libres.filter(l=>l.uid!==u);save();render()},
  libre(u,k,v){const l=S.libres.find(x=>x.uid===u);l[k]=v;save()},
  posLibre(u){const l=S.libres.find(x=>x.uid===u);picker("¿Dónde va esta lámina?",POS.map(p=>({v:p.id,t:p.t})),l.pos,v=>{l.pos=v;save();render()})},
  async preview(start,onlyAct){
    const all=plan();const hs=await renderHtmlSlides(all);
    const idx=onlyAct?[all.findIndex(p=>p.k==="act"&&p.a.uid===onlyAct)]:all.map((_,i)=>i);
    if(start===-1){const want=[["portada"],["crv","circ","perf","rrss"],["objetivos"],["act"],["tarifas"],["comunicacion"],["condiciones","enlaces"],["libre"],["portada"]][cur]||["portada"];
      start=Math.max(0,all.findIndex(p=>want.includes(p.k)))}
    let pos=Math.max(0,Math.min(idx.length-1,start>0?start:0));
    layer.innerHTML=`<div class="pv"><div class="pv-top"><span>Vista previa</span><button class="hbtn" onclick="closeLayer()">✕ Cerrar</button></div>
      <div class="pv-stage" id="pvs"><div class="sw" id="pvsw"></div></div>
      <div class="pv-nav"><button id="pvp">‹</button><div class="cnt" id="pvn"></div><button id="pvx">›</button></div></div>`;
    const sw=$("#pvsw");
    const show=()=>{const i=idx[pos];sw.innerHTML=hs[i];scaleSlides($("#pvs"));
      $("#pvn").innerHTML=`${i+1} / ${all.length}<br>${esc(all[i].name)}`;$("#pvp").disabled=pos===0;$("#pvx").disabled=pos===idx.length-1};
    const go=d=>{const n=pos+d;if(n<0||n>=idx.length)return;pos=n;show()};
    $("#pvp").onclick=()=>go(-1);$("#pvx").onclick=()=>go(1);
    let x0=null;const st=$("#pvs");st.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
    st.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>40)go(dx<0?1:-1)});
    PVKEY=e=>{if(!$("#pvs"))return;if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);else if(e.key==="Escape")closeLayer()};
    show();
  },
  previewAct(u){A.preview(0,u)},
  generar(){generarPPTX().catch(e=>{console.error(e);alert("Error al generar: "+e.message)})},
  menu(){picker("Menú",[{v:"nuevo",t:"🆕 Nueva propuesta",sub:"Borra la propuesta actual"},{v:"exp",t:"💾 Guardar propuesta (archivo)",sub:"Para retomarla o duplicarla después"},{v:"imp",t:"📂 Abrir propuesta guardada"}],null,v=>{
    if(v==="nuevo"&&confirm("¿Borrar la propuesta actual y empezar una nueva?")){S=nuevo();cur=0;save();render()}
    if(v==="exp"){const b=new Blob([JSON.stringify(S)],{type:"application/json"});const l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="Propuesta "+(S.prospecto||"sin nombre")+".json";l.click()}
    if(v==="imp"){const i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=async()=>{try{S=Object.assign(nuevo(),JSON.parse(await i.files[0].text()));normalizar();cur=0;save();render();toast("Propuesta abierta")}catch(e){alert("Archivo no válido")}};i.click()}
  })}
};
$("#hlogo").src=LOGO_CRV.data;
render();
</script>
</body>
</html>
